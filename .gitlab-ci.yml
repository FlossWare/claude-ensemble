.default_rules: &default_rules
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

.node_cache: &node_cache
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
    policy: pull

stages:
  - deps
  - test
  - quality

# Install dependencies once, cache for other jobs
install:
  stage: deps
  image: node:18
  script:
    - npm ci
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
    policy: push
  <<: *default_rules

# Run tests on every commit
test:
  stage: test
  image: node:18
  <<: *node_cache
  script:
    - npm test
  <<: *default_rules

# Code quality checks
lint:
  stage: quality
  image: node:18
  <<: *node_cache
  script:
    - npm run lint || echo "Linting not configured - skipping"
  allow_failure: true
  <<: *default_rules

# Security audit
security:
  stage: quality
  image: node:18
  <<: *node_cache
  script:
    - npm audit --audit-level=high
  allow_failure: true
  <<: *default_rules
