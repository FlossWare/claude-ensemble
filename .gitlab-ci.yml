stages:
  - test
  - quality

# Run tests on every commit
test:
  stage: test
  image: node:18
  before_script:
    - npm ci
  script:
    - npm test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# Code quality checks
lint:
  stage: quality
  image: node:18
  before_script:
    - npm ci
  script:
    - npm run lint || echo "Linting not configured - skipping"
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# Security audit
security:
  stage: quality
  image: node:18
  before_script:
    - npm ci
  script:
    - npm audit --audit-level=high
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
