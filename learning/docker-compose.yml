version: '3.9'

services:
  grafana-learning-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grafana-learning-api
    ports:
      - "3000:3000"
    volumes:
      - ./db/learning.db:/app/db/learning.db:ro
    environment:
      - NODE_ENV=production
      - DB_PATH=/app/db/learning.db
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Optional: Grafana instance for testing
  grafana:
    image: grafana/grafana:latest
    container_name: grafana-ai-learning
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-simple-json-datasource
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana-dashboard.json:/etc/grafana/provisioning/dashboards/learning.json:ro
    depends_on:
      - grafana-learning-api
    restart: unless-stopped

volumes:
  grafana-storage:
    driver: local
