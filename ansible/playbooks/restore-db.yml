---
# Disaster Recovery: Restore PostgreSQL from backup
#
# Searches backup destinations for the latest dump, restores it,
# and verifies via REST API (never direct psql).
#
# Usage:
#   ansible-playbook -i inventory/hosts.yml playbooks/restore-db.yml
#   ansible-playbook -i inventory/hosts.yml playbooks/restore-db.yml -e backup_source=server-ap
#   ansible-playbook -i inventory/hosts.yml playbooks/restore-db.yml -e backup_file=/path/to/specific.dump
#   ansible-playbook -i inventory/hosts.yml playbooks/restore-db.yml --check  # dry run

- name: Restore PostgreSQL from backup
  hosts: controller
  become: true
  vars:
    backup_sources:
      - { host: "server-ap", path: "/exports/backups/aio-01-learning/" }
      - { host: "server-01", path: "/exports/backups/aio-01-learning/" }
      - { host: "server-02", path: "/exports/backups/aio-01-learning/" }
      - { host: "server-03", path: "/exports/backups/aio-01-learning/" }
      - { host: "localhost", path: "{{ claude_home | default('/home/claude') }}/backups/aio-01-learning/" }
    restore_db: "{{ db_name }}"
    restore_port: "{{ db_port }}"
    restore_user: postgres
    restore_tmp: /tmp/restore-learning.dump

  tasks:
    # --- Phase 1: Stop dependent services ---

    - name: Stop unified API before restore
      ansible.builtin.systemd:
        name: unified-api
        state: stopped
      register: api_stopped

    - name: Stop knowledge worker before restore
      ansible.builtin.systemd:
        name: knowledge-worker
        state: stopped
      failed_when: false

    # --- Phase 2: Locate backup ---

    - name: Use specified backup file
      ansible.builtin.set_fact:
        restore_source: "{{ backup_file }}"
        restore_host: localhost
      when: backup_file is defined

    - name: Search backup sources for latest dump
      ansible.builtin.shell: |
        ls -t {{ item.path }}learning_*.dump 2>/dev/null | head -1
      register: backup_search
      loop: "{{ backup_sources }}"
      when:
        - backup_file is not defined
        - backup_source is not defined or backup_source == item.host
      changed_when: false
      failed_when: false
      delegate_to: "{{ item.host }}"

    - name: Select first available backup
      ansible.builtin.set_fact:
        restore_source: "{{ item.stdout }}"
        restore_host: "{{ item.item.host }}"
      loop: "{{ backup_search.results | default([]) }}"
      when:
        - backup_file is not defined
        - item.stdout is defined
        - item.stdout | length > 0
        - restore_source is not defined

    - name: Fail if no backup found
      ansible.builtin.fail:
        msg: "No backup dump found in any backup source. Check backup destinations."
      when: restore_source is not defined

    - name: Display selected backup
      ansible.builtin.debug:
        msg: "Restoring from {{ restore_host }}:{{ restore_source }}"

    # --- Phase 3: Copy backup to controller ---

    - name: Copy backup to controller (remote source)
      ansible.builtin.shell: |
        scp {{ restore_host }}:{{ restore_source }} {{ restore_tmp }}
      when: restore_host != 'localhost'

    - name: Copy backup to controller (local source)
      ansible.builtin.copy:
        src: "{{ restore_source }}"
        dest: "{{ restore_tmp }}"
        remote_src: true
      when: restore_host == 'localhost'

    # --- Phase 4: Restore database ---

    - name: Terminate active connections to database
      community.postgresql.postgresql_query:
        db: postgres
        port: "{{ restore_port }}"
        query: >
          SELECT pg_terminate_backend(pid) FROM pg_stat_activity
          WHERE datname = '{{ restore_db }}' AND pid != pg_backend_pid()
      become_user: "{{ restore_user }}"
      failed_when: false

    - name: Drop existing database
      community.postgresql.postgresql_db:
        name: "{{ restore_db }}"
        state: absent
        port: "{{ restore_port }}"
      become_user: "{{ restore_user }}"

    - name: Create fresh database
      community.postgresql.postgresql_db:
        name: "{{ restore_db }}"
        state: present
        port: "{{ restore_port }}"
      become_user: "{{ restore_user }}"

    - name: Create pgvector extension
      community.postgresql.postgresql_ext:
        name: vector
        db: "{{ restore_db }}"
        port: "{{ restore_port }}"
        state: present
      become_user: "{{ restore_user }}"

    - name: Restore from dump
      ansible.builtin.command: >
        pg_restore -h localhost -p {{ restore_port }} -U {{ restore_user }}
        -d {{ restore_db }} --no-owner --no-acl --jobs=2 {{ restore_tmp }}
      become_user: "{{ restore_user }}"
      register: restore_result
      failed_when: restore_result.rc not in [0, 1]

    - name: Display restore warnings (if any)
      ansible.builtin.debug:
        msg: "{{ restore_result.stderr_lines | default([]) }}"
      when: restore_result.rc == 1

    # --- Phase 5: Restart services ---

    - name: Start unified API
      ansible.builtin.systemd:
        name: unified-api
        state: started

    - name: Start knowledge worker
      ansible.builtin.systemd:
        name: knowledge-worker
        state: started
      failed_when: false

    # --- Phase 6: Verify via REST API ---

    - name: Wait for API to become healthy
      ansible.builtin.uri:
        url: "http://localhost:{{ api_port }}/health"
        method: GET
        status_code: 200
        timeout: 10
      register: post_restore_health
      retries: 15
      delay: 3
      until: post_restore_health.status == 200

    - name: Verify database stats via REST API
      ansible.builtin.uri:
        url: "http://localhost:{{ api_port }}/learning/stats"
        method: GET
        status_code: 200
        timeout: 10
      register: db_stats_check
      failed_when: false

    - name: Verify memory store has data
      ansible.builtin.uri:
        url: "http://localhost:{{ api_port }}/learning/memory?limit=1"
        method: GET
        status_code: 200
        timeout: 10
      register: memory_verify

    - name: Verify secrets are accessible
      ansible.builtin.uri:
        url: "http://localhost:{{ api_port }}/secrets/"
        method: GET
        status_code: 200
        timeout: 10
      register: secrets_verify
      failed_when: false

    - name: Display restore summary
      ansible.builtin.debug:
        msg: |
          === RESTORE COMPLETE ===
          Source: {{ restore_host }}:{{ restore_source }}
          API health: {{ post_restore_health.json.status | default('unknown') }}
          DB stats: {{ db_stats_check.json | default('unavailable') }}
          Memories: {{ memory_verify.json | length | default(0) }} found
          Secrets: {{ secrets_verify.json.secrets | length | default(0) }} keys available

    # --- Phase 7: Cleanup ---

    - name: Clean up temp dump file
      ansible.builtin.file:
        path: "{{ restore_tmp }}"
        state: absent
