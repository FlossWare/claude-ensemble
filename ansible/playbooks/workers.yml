---
# Workers-only deployment
# Configures all 8 worker nodes: NFS client, worker setup, scraping, node_exporter
#
# Usage:
#   ansible-playbook -i inventory/hosts.yml playbooks/workers.yml
#   ansible-playbook -i inventory/hosts.yml playbooks/workers.yml --limit server-01
#   ansible-playbook -i inventory/hosts.yml playbooks/workers.yml --limit x86_workers

- name: Apply common baseline to workers
  hosts: workers
  become: true
  roles:
    - common

- name: Mount NFS shares
  hosts: workers
  become: true
  roles:
    - role: nfs
      nfs_role: client

- name: Deploy node_exporter
  hosts: workers
  become: true
  roles:
    - role: monitoring
      monitoring_component: node_exporter

- name: Configure worker nodes
  hosts: workers
  become: true
  roles:
    - worker

- name: Deploy scraping workers
  hosts: workers
  become: true
  roles:
    - scraping

- name: Deploy Grafana on pi-02
  hosts: grafana_hosts
  become: true
  roles:
    - role: monitoring
      monitoring_component: grafana
