---
# Distributed LLM Orchestration Fleet Inventory
# 9 nodes: 1 controller + 8 workers (API-only, no local models)

all:
  vars:
    ansible_user: claude
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'

  children:
    # ---- Controller (orchestrator + services) ----
    controller:
      hosts:
        aio-01:
          ansible_host: 192.168.1.11
          ansible_python_interpreter: /usr/bin/python3
          node_role: controller
          cpu_cores: 2
          ram_gb: 7
          arch: x86_64
          services:
            - postgresql
            - redis
            - flask_api
            - nfs_server
            - prometheus
            - alertmanager

    # ---- Workers ----
    workers:
      children:
        x86_workers:
          hosts:
            server-01:
              ansible_host: 192.168.1.14
              ansible_python_interpreter: /usr/bin/python3
              node_role: worker
              cpu_cores: 8
              ram_gb: 16
              arch: x86_64

            server-02:
              ansible_host: 192.168.1.15
              ansible_python_interpreter: /usr/bin/python3
              node_role: worker
              cpu_cores: 8
              ram_gb: 32
              arch: x86_64

            server-03:
              ansible_host: 192.168.1.16
              ansible_python_interpreter: /usr/bin/python3
              node_role: worker
              cpu_cores: 8
              ram_gb: 32
              arch: x86_64

        arm64_workers:
          hosts:
            pi-01:
              ansible_host: 192.168.1.9
              ansible_python_interpreter: /usr/bin/python3
              node_role: worker
              cpu_cores: 4
              ram_gb: 1
              arch: aarch64

            pi-02:
              ansible_host: 192.168.1.10
              ansible_python_interpreter: /usr/bin/python3
              node_role: worker
              cpu_cores: 4
              ram_gb: 1
              arch: aarch64
              services:
                - grafana

        armv7_workers:
          hosts:
            desktop-ap:
              ansible_host: 192.168.1.5
              ansible_python_interpreter: /usr/bin/python3
              node_role: worker
              cpu_cores: 4
              ram_gb: 1
              arch: armv7l

            server-ap:
              ansible_host: 192.168.1.4
              ansible_python_interpreter: /usr/bin/python3
              node_role: worker
              cpu_cores: 4
              ram_gb: 1
              arch: armv7l
              services:
                - backup_target

    # ---- Functional groups (for targeted plays) ----
    nfs_clients:
      children:
        workers: {}

    nfs_servers:
      children:
        controller: {}

    monitoring_targets:
      children:
        controller: {}
        workers: {}

    grafana_hosts:
      hosts:
        pi-02: {}

    backup_targets:
      hosts:
        server-ap: {}

    high_memory:
      hosts:
        server-02: {}
        server-03: {}
