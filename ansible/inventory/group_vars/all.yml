---
# Shared variables for the distributed LLM orchestration fleet

# --- Controller ---
controller_host: aio-01

# --- API ---
api_port: 5000
api_base: "http://{{ controller_host }}:{{ api_port }}"
gunicorn_workers: 8
gunicorn_timeout: 300
gunicorn_bind: "0.0.0.0:{{ api_port }}"

# --- Database (PostgreSQL) ---
db_port: 5433
db_name: learning
db_user: postgres
db_host: "{{ controller_host }}"
db_schemas:
  - learning
  - workflow
  - monitoring
  - costs
  - knowledge

# --- Redis ---
redis_port: 6379

# --- User ---
claude_uid: 2000
claude_user: claude
claude_home: /home/claude

# --- NFS ---
nfs_export: /exports/claude-orchestrator
nfs_mount_point: /mnt/claude-orchestrator
scraped_data_dir: "{{ nfs_export }}/scraped-data/raw"

# --- Monitoring ---
node_exporter_port: 9100
prometheus_port: 9090
grafana_port: 3000
alertmanager_port: 9093

# --- Source code ---
source_code_dir: "{{ nfs_export }}/source-code"
orchestrator_repo: "https://gitlab.cee.redhat.com/sfloess/claude-global-skills.git"

# --- Worker ---
worker_dir: "{{ claude_home }}/workers"
max_parallel_workers: 3

# --- Scraping ---
scraping_enabled: true
scraping_workers_per_node: 2

# --- Backup ---
backup_dir: /exports/backups
backup_retention_days: 30

# --- API keys (vault-encrypted) ---
openrouter_api_key: "{{ vault_openrouter_api_key }}"
anthropic_api_key: "{{ vault_anthropic_api_key }}"
google_api_key: "{{ vault_google_api_key }}"
groq_api_key: "{{ vault_groq_api_key }}"
cerebras_api_key: "{{ vault_cerebras_api_key }}"
deepseek_api_key: "{{ vault_deepseek_api_key }}"

# --- Package lists (platform-aware) ---
common_packages:
  - python3
  - python3-pip
  - git
  - curl
  - jq
  - rsync
  - htop

x86_packages:
  - nodejs
  - npm

# --- Timeouts ---
health_check_timeout_ms: 2000
ssh_timeout: 30
