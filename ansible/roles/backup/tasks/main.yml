---
# backup role - PostgreSQL backup cron on controller (aio-01)
# Deploys backup script, cron job, retention cleanup, and embedding cleanup

- name: Ensure claude bin directory exists
  ansible.builtin.file:
    path: "{{ claude_home }}/bin"
    state: directory
    owner: "{{ claude_user }}"
    group: "{{ claude_user }}"
    mode: "0755"
  become: true

- name: Create backup destination directory
  ansible.builtin.file:
    path: "{{ backup_dir }}/learning"
    state: directory
    owner: "{{ claude_user }}"
    group: "{{ claude_user }}"
    mode: "0755"
  become: true

- name: Create backup log directory
  ansible.builtin.file:
    path: "{{ claude_home }}/logs"
    state: directory
    owner: "{{ claude_user }}"
    group: "{{ claude_user }}"
    mode: "0755"
  become: true

- name: Deploy backup script
  ansible.builtin.template:
    src: backup-learning-db.sh.j2
    dest: "{{ claude_home }}/bin/backup-learning-db.sh"
    owner: "{{ claude_user }}"
    group: "{{ claude_user }}"
    mode: "0755"
  become: true

- name: Deploy embedding cleanup script
  ansible.builtin.template:
    src: cleanup-old-embeddings.sh.j2
    dest: "{{ claude_home }}/bin/cleanup-old-embeddings.sh"
    owner: "{{ claude_user }}"
    group: "{{ claude_user }}"
    mode: "0755"
  become: true

- name: Set up daily backup cron job (2 AM)
  ansible.builtin.cron:
    name: "learning-db-backup"
    user: "{{ claude_user }}"
    minute: "0"
    hour: "2"
    job: "{{ claude_home }}/bin/backup-learning-db.sh >> {{ claude_home }}/logs/backup.log 2>&1"
    state: present
  become: true

- name: Set up 30-day retention cleanup cron (3 AM daily)
  ansible.builtin.cron:
    name: "backup-retention-cleanup"
    user: "{{ claude_user }}"
    minute: "0"
    hour: "3"
    job: "find {{ backup_dir }}/learning -name 'learning_*.dump' -mtime +{{ backup_retention_days }} -delete >> {{ claude_home }}/logs/backup-cleanup.log 2>&1"
    state: present
  become: true

- name: Set up 90-day embedding cleanup cron (Sunday 4 AM)
  ansible.builtin.cron:
    name: "embedding-cleanup-90d"
    user: "{{ claude_user }}"
    minute: "0"
    hour: "4"
    weekday: "0"
    job: "{{ claude_home }}/bin/cleanup-old-embeddings.sh >> {{ claude_home }}/logs/embedding-cleanup.log 2>&1"
    state: present
  become: true
