---
- name: Create scraper working directory
  ansible.builtin.file:
    path: /home/claude/workers/scrapers
    state: directory
    owner: claude
    group: claude
    mode: "0755"
  become: true

- name: Deploy scraper worker script
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../scripts/redis-queue-worker.py"
    dest: /home/claude/workers/redis-queue-worker.py
    owner: claude
    group: claude
    mode: "0755"
  become: true

- name: Install scraper Python dependencies
  ansible.builtin.pip:
    name:
      - requests
      - beautifulsoup4
      - feedparser
      - lxml
    state: present
    executable: pip3
  become: true

- name: Deploy scraper worker systemd service
  ansible.builtin.template:
    src: scraper-worker.service.j2
    dest: /etc/systemd/system/scraper-worker.service
    mode: "0644"
  become: true
  notify: reload systemd

- name: Verify controller API is reachable
  ansible.builtin.uri:
    url: "{{ api_base }}/health"
    method: GET
    status_code: 200
    timeout: 10
  register: api_health
  failed_when: false

- name: Display API connectivity status
  ansible.builtin.debug:
    msg: "API at {{ api_base }}: {{ 'reachable' if api_health.status == 200 else 'unreachable' }}"
