---
# worker role - Configure worker nodes for distributed task execution
# Runs on all machines in the 'workers' group

- name: Create worker directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ claude_user }}"
    group: "{{ claude_user }}"
    mode: "0755"
  loop:
    - "{{ claude_home }}/workers"
    - "{{ claude_home }}/logs"
  become: true

- name: Install worker Python packages
  ansible.builtin.pip:
    name:
      - requests
      - beautifulsoup4
      - feedparser
      - lxml
    state: present
    executable: pip3
  become: true

- name: Deploy scraper worker script
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../scripts/redis-queue-worker.py"
    dest: "{{ claude_home }}/workers/redis-queue-worker.py"
    owner: "{{ claude_user }}"
    group: "{{ claude_user }}"
    mode: "0755"
  become: true
  notify: restart scraper-worker

- name: Deploy scraper worker systemd service
  ansible.builtin.template:
    src: scraper-worker.service.j2
    dest: /etc/systemd/system/scraper-worker.service
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: restart scraper-worker

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

- name: Enable and start scraper-worker service
  ansible.builtin.systemd:
    name: scraper-worker
    enabled: true
    state: started
  become: true

- name: Test connectivity to controller API
  ansible.builtin.uri:
    url: "{{ api_base }}/health"
    method: GET
    status_code: 200
    timeout: "{{ health_check_timeout_ms // 1000 }}"
  register: controller_reachable
  retries: 3
  delay: 5
  until: controller_reachable.status == 200

- name: Register worker with controller
  ansible.builtin.uri:
    url: "{{ api_base }}/fleet/register"
    method: POST
    body_format: json
    body:
      worker_id: "{{ worker_id | default(inventory_hostname) }}"
      hostname: "{{ inventory_hostname }}"
      ip: "{{ ansible_host }}"
      cpu_cores: "{{ cpu_cores | default(ansible_processor_vcpus) }}"
      ram_gb: "{{ ram_gb | default(1) }}"
      arch: "{{ arch | default(ansible_architecture) }}"
    status_code: [200, 201]
  register: registration_result
  retries: 3
  delay: 5
  until: registration_result.status in [200, 201]
