---
# PostgreSQL role - runs on controller (aio-01) only
# Installs PostgreSQL 16 with pgvector, deploys schema for learning database

# --- Installation ---

- name: Install PostgreSQL 16 and development headers (Fedora/RHEL)
  ansible.builtin.dnf:
    name:
      - postgresql16-server
      - postgresql16
      - postgresql16-devel
      - postgresql16-contrib
    state: present
  become: true
  when: ansible_pkg_mgr in ['dnf', 'yum']

- name: Install PostgreSQL 16 and development headers (Debian/Ubuntu)
  ansible.builtin.apt:
    name:
      - postgresql-16
      - postgresql-server-dev-16
      - postgresql-client-16
      - postgresql-16-pgvector
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  when: ansible_pkg_mgr == 'apt'

# --- pgvector extension ---

- name: Install pgvector build dependencies (Fedora/RHEL)
  ansible.builtin.dnf:
    name:
      - gcc
      - make
      - git
    state: present
  become: true
  when: ansible_pkg_mgr in ['dnf', 'yum']

- name: Check if pgvector is already installed
  ansible.builtin.stat:
    path: /usr/pgsql-16/lib/vector.so
  register: pgvector_lib
  when: ansible_pkg_mgr in ['dnf', 'yum']

- name: Clone pgvector source
  ansible.builtin.git:
    repo: https://github.com/pgvector/pgvector.git
    dest: /tmp/pgvector
    version: v0.7.4
    depth: 1
  become: true
  when:
    - ansible_pkg_mgr in ['dnf', 'yum']
    - not (pgvector_lib.stat.exists | default(false))

- name: Build and install pgvector from source
  ansible.builtin.shell: |
    cd /tmp/pgvector
    export PG_CONFIG=/usr/pgsql-16/bin/pg_config
    make clean && make && make install
  args:
    creates: /usr/pgsql-16/lib/vector.so
  become: true
  when:
    - ansible_pkg_mgr in ['dnf', 'yum']
    - not (pgvector_lib.stat.exists | default(false))

- name: Clean up pgvector build directory
  ansible.builtin.file:
    path: /tmp/pgvector
    state: absent
  become: true

# --- PostgreSQL initialization ---

- name: Check if PostgreSQL data directory is initialized
  ansible.builtin.stat:
    path: "{{ pg_data_dir }}/PG_VERSION"
  register: pg_data
  become: true

- name: Initialize PostgreSQL database cluster
  ansible.builtin.command:
    cmd: /usr/pgsql-16/bin/initdb -D {{ pg_data_dir }}
  become: true
  become_user: postgres
  when: not pg_data.stat.exists

# --- Configuration ---

- name: Deploy postgresql.conf customizations
  ansible.builtin.lineinfile:
    path: "{{ pg_data_dir }}/postgresql.conf"
    regexp: "^{{ item.key }}\\s*="
    line: "{{ item.key }} = {{ item.value }}"
    state: present
  loop:
    - { key: "listen_addresses", value: "'{{ pg_listen_addresses }}'" }
    - { key: "port", value: "{{ pg_port }}" }
    - { key: "max_connections", value: "{{ pg_max_connections }}" }
    - { key: "shared_buffers", value: "'{{ pg_shared_buffers }}'" }
    - { key: "work_mem", value: "'{{ pg_work_mem }}'" }
    - { key: "maintenance_work_mem", value: "'{{ pg_maintenance_work_mem }}'" }
    - { key: "shared_preload_libraries", value: "'vector'" }
  become: true
  become_user: postgres
  notify: Restart PostgreSQL

- name: Deploy pg_hba.conf
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: "{{ pg_data_dir }}/pg_hba.conf"
    owner: postgres
    group: postgres
    mode: "0600"
  become: true
  notify: Restart PostgreSQL

# --- Service management ---

- name: Ensure PostgreSQL service is enabled and running
  ansible.builtin.systemd:
    name: postgresql-16
    state: started
    enabled: true
  become: true

# Flush handlers to restart PostgreSQL before creating databases
- name: Flush handlers
  ansible.builtin.meta: flush_handlers

# --- Database and extension setup ---

- name: Create learning database
  community.postgresql.postgresql_db:
    name: "{{ pg_db_name }}"
    state: present
    port: "{{ pg_port }}"
  become: true
  become_user: postgres

- name: Create claude database user
  community.postgresql.postgresql_user:
    name: "{{ pg_db_user }}"
    password: "{{ pg_db_password | default(omit) }}"
    role_attr_flags: CREATEDB,NOSUPERUSER
    port: "{{ pg_port }}"
    db: "{{ pg_db_name }}"
  become: true
  become_user: postgres

- name: Grant all privileges on learning database to claude
  community.postgresql.postgresql_privs:
    database: "{{ pg_db_name }}"
    privs: ALL
    type: database
    role: "{{ pg_db_user }}"
    port: "{{ pg_port }}"
  become: true
  become_user: postgres

- name: Create pgvector extension in learning database
  community.postgresql.postgresql_ext:
    name: vector
    db: "{{ pg_db_name }}"
    port: "{{ pg_port }}"
    state: present
  become: true
  become_user: postgres

# --- Schema deployment ---

- name: Copy full schema SQL to controller
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../files/sql/full-schema.sql"
    dest: /tmp/full-schema.sql
    owner: postgres
    group: postgres
    mode: "0644"
  become: true

- name: Check if schema has been applied (check for learning schema)
  community.postgresql.postgresql_query:
    db: "{{ pg_db_name }}"
    port: "{{ pg_port }}"
    query: >
      SELECT schema_name FROM information_schema.schemata
      WHERE schema_name = 'learning'
  become: true
  become_user: postgres
  register: schema_check

- name: Apply full database schema
  ansible.builtin.command:
    cmd: >
      psql -h localhost -p {{ pg_port }} -d {{ pg_db_name }}
      --single-transaction -f /tmp/full-schema.sql
  become: true
  become_user: postgres
  when: schema_check.rowcount == 0

- name: Clean up schema SQL from temp
  ansible.builtin.file:
    path: /tmp/full-schema.sql
    state: absent
  become: true
