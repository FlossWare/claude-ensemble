---
# Handlers for monitoring role

- name: restart node_exporter
  ansible.builtin.systemd:
    name: node_exporter
    state: restarted
    daemon_reload: true
  become: true

- name: restart prometheus
  ansible.builtin.systemd:
    name: prometheus
    state: restarted
    daemon_reload: true
  become: true

- name: restart alertmanager
  ansible.builtin.systemd:
    name: alertmanager
    state: restarted
    daemon_reload: true
  become: true

- name: restart grafana
  ansible.builtin.systemd:
    name: grafana-server
    state: restarted
  become: true
