---
# monitoring role - Prometheus/Alertmanager on controller, node_exporter everywhere, Grafana on pi-02
# Requires: common role applied first

# ============================================================
# Section 1: node_exporter - ALL hosts
# ============================================================

- name: Set node_exporter arch suffix
  ansible.builtin.set_fact:
    node_exporter_arch: >-
      {{ 'linux-amd64' if ansible_architecture == 'x86_64'
         else 'linux-arm64' if ansible_architecture == 'aarch64'
         else 'linux-armv7' if ansible_architecture == 'armv7l'
         else 'linux-amd64' }}

- name: Check if node_exporter is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/node_exporter
  register: node_exporter_binary

- name: Download node_exporter
  ansible.builtin.unarchive:
    src: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.{{ node_exporter_arch }}.tar.gz"
    dest: /tmp
    remote_src: true
  become: true
  when: not node_exporter_binary.stat.exists

- name: Install node_exporter binary
  ansible.builtin.copy:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.{{ node_exporter_arch }}/node_exporter"
    dest: /usr/local/bin/node_exporter
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  become: true
  when: not node_exporter_binary.stat.exists

- name: Clean up node_exporter tarball
  ansible.builtin.file:
    path: "/tmp/node_exporter-{{ node_exporter_version }}.{{ node_exporter_arch }}"
    state: absent
  become: true
  when: not node_exporter_binary.stat.exists

- name: Deploy node_exporter systemd service
  ansible.builtin.template:
    src: node-exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: restart node_exporter

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

- name: Enable and start node_exporter
  ansible.builtin.systemd:
    name: node_exporter
    enabled: true
    state: started
  become: true

# ============================================================
# Section 2: Prometheus + Alertmanager - controller only
# ============================================================

- name: Set Prometheus arch suffix
  ansible.builtin.set_fact:
    prometheus_arch: >-
      {{ 'linux-amd64' if ansible_architecture == 'x86_64'
         else 'linux-arm64' if ansible_architecture == 'aarch64'
         else 'linux-armv7' if ansible_architecture == 'armv7l'
         else 'linux-amd64' }}
  when: inventory_hostname in groups['controller']

- name: Check if Prometheus is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/prometheus
  register: prometheus_binary
  when: inventory_hostname in groups['controller']

- name: Download Prometheus
  ansible.builtin.unarchive:
    src: "https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}/prometheus-{{ prometheus_version }}.{{ prometheus_arch }}.tar.gz"
    dest: /tmp
    remote_src: true
  become: true
  when:
    - inventory_hostname in groups['controller']
    - not prometheus_binary.stat.exists

- name: Install Prometheus binaries
  ansible.builtin.copy:
    src: "/tmp/prometheus-{{ prometheus_version }}.{{ prometheus_arch }}/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  loop:
    - prometheus
    - promtool
  become: true
  when:
    - inventory_hostname in groups['controller']
    - not prometheus_binary.stat.exists

- name: Clean up Prometheus tarball
  ansible.builtin.file:
    path: "/tmp/prometheus-{{ prometheus_version }}.{{ prometheus_arch }}"
    state: absent
  become: true
  when:
    - inventory_hostname in groups['controller']
    - not prometheus_binary.stat.exists

- name: Create Prometheus directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ claude_user }}"
    group: "{{ claude_user }}"
    mode: "0755"
  loop:
    - /etc/prometheus
    - /var/lib/prometheus
  become: true
  when: inventory_hostname in groups['controller']

- name: Deploy prometheus.yml config
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
    owner: "{{ claude_user }}"
    group: "{{ claude_user }}"
    mode: "0644"
  become: true
  when: inventory_hostname in groups['controller']
  notify: restart prometheus

- name: Deploy Prometheus alert rules
  ansible.builtin.template:
    src: alert_rules.yml.j2
    dest: /etc/prometheus/alert_rules.yml
    owner: "{{ claude_user }}"
    group: "{{ claude_user }}"
    mode: "0644"
  become: true
  when: inventory_hostname in groups['controller']
  notify: restart prometheus

- name: Deploy Prometheus systemd service
  ansible.builtin.template:
    src: prometheus.service.j2
    dest: /etc/systemd/system/prometheus.service
    owner: root
    group: root
    mode: "0644"
  become: true
  when: inventory_hostname in groups['controller']
  notify: restart prometheus

# --- Alertmanager ---

- name: Check if Alertmanager is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/alertmanager
  register: alertmanager_binary
  when: inventory_hostname in groups['controller']

- name: Download Alertmanager
  ansible.builtin.unarchive:
    src: "https://github.com/prometheus/alertmanager/releases/download/v{{ alertmanager_version }}/alertmanager-{{ alertmanager_version }}.{{ prometheus_arch }}.tar.gz"
    dest: /tmp
    remote_src: true
  become: true
  when:
    - inventory_hostname in groups['controller']
    - not alertmanager_binary.stat.exists

- name: Install Alertmanager binary
  ansible.builtin.copy:
    src: "/tmp/alertmanager-{{ alertmanager_version }}.{{ prometheus_arch }}/alertmanager"
    dest: /usr/local/bin/alertmanager
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  become: true
  when:
    - inventory_hostname in groups['controller']
    - not alertmanager_binary.stat.exists

- name: Clean up Alertmanager tarball
  ansible.builtin.file:
    path: "/tmp/alertmanager-{{ alertmanager_version }}.{{ prometheus_arch }}"
    state: absent
  become: true
  when:
    - inventory_hostname in groups['controller']
    - not alertmanager_binary.stat.exists

- name: Create Alertmanager directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ claude_user }}"
    group: "{{ claude_user }}"
    mode: "0755"
  loop:
    - /etc/alertmanager
    - /var/lib/alertmanager
  become: true
  when: inventory_hostname in groups['controller']

- name: Deploy alertmanager.yml config
  ansible.builtin.template:
    src: alertmanager.yml.j2
    dest: /etc/alertmanager/alertmanager.yml
    owner: "{{ claude_user }}"
    group: "{{ claude_user }}"
    mode: "0644"
  become: true
  when: inventory_hostname in groups['controller']
  notify: restart alertmanager

- name: Deploy Alertmanager systemd service
  ansible.builtin.template:
    src: alertmanager.service.j2
    dest: /etc/systemd/system/alertmanager.service
    owner: root
    group: root
    mode: "0644"
  become: true
  when: inventory_hostname in groups['controller']
  notify: restart alertmanager

- name: Reload systemd daemon (controller)
  ansible.builtin.systemd:
    daemon_reload: true
  become: true
  when: inventory_hostname in groups['controller']

- name: Enable and start Prometheus
  ansible.builtin.systemd:
    name: prometheus
    enabled: true
    state: started
  become: true
  when: inventory_hostname in groups['controller']

- name: Enable and start Alertmanager
  ansible.builtin.systemd:
    name: alertmanager
    enabled: true
    state: started
  become: true
  when: inventory_hostname in groups['controller']

# ============================================================
# Section 3: Grafana - pi-02 only
# ============================================================

- name: Add Grafana APT repository key (pi-02)
  ansible.builtin.apt_key:
    url: https://apt.grafana.com/gpg.key
    state: present
  become: true
  when: inventory_hostname == 'pi-02'

- name: Add Grafana APT repository (pi-02)
  ansible.builtin.apt_repository:
    repo: "deb https://apt.grafana.com stable main"
    state: present
    filename: grafana
  become: true
  when: inventory_hostname == 'pi-02'

- name: Install Grafana (pi-02)
  ansible.builtin.apt:
    name: grafana
    state: present
    update_cache: true
  become: true
  when: inventory_hostname == 'pi-02'

- name: Deploy Grafana Prometheus datasource (pi-02)
  ansible.builtin.template:
    src: grafana-datasource.yml.j2
    dest: /etc/grafana/provisioning/datasources/prometheus.yml
    owner: root
    group: grafana
    mode: "0640"
  become: true
  when: inventory_hostname == 'pi-02'
  notify: restart grafana

- name: Configure Grafana port (pi-02)
  ansible.builtin.lineinfile:
    path: /etc/grafana/grafana.ini
    regexp: "^;?http_port ="
    line: "http_port = {{ grafana_port }}"
    section: server
  become: true
  when: inventory_hostname == 'pi-02'
  notify: restart grafana

- name: Enable and start Grafana (pi-02)
  ansible.builtin.systemd:
    name: grafana-server
    enabled: true
    state: started
  become: true
  when: inventory_hostname == 'pi-02'
