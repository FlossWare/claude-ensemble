---
# Common role defaults

# SSH public key for claude user (override via vault or host_vars)
claude_ssh_public_key: ""

# Base packages - Fedora/RHEL (dnf)
common_packages_dnf:
  - python3
  - python3-pip
  - nodejs
  - npm
  - git
  - curl
  - jq
  - rsync

# Base packages - Debian/Ubuntu (apt)
common_packages_apt:
  - python3
  - python3-pip
  - nodejs
  - npm
  - git
  - curl
  - jq
  - rsync

# Python pip packages
common_pip_packages:
  - requests
  - numpy
  - psycopg2-binary
  - beautifulsoup4

# Fleet /etc/hosts entries
fleet_hosts:
  - { name: aio-01, ip: "192.168.1.11" }
  - { name: server-01, ip: "192.168.1.14" }
  - { name: server-02, ip: "192.168.1.15" }
  - { name: server-03, ip: "192.168.1.16" }
  - { name: pi-01, ip: "192.168.1.9" }
  - { name: pi-02, ip: "192.168.1.10" }
  - { name: desktop-ap, ip: "192.168.1.5" }
  - { name: server-ap, ip: "192.168.1.4" }
  - { name: laptop-01, ip: "192.168.1.17" }
  - { name: laptop-02, ip: "192.168.1.18" }

# API key vault variables (override via ansible-vault)
vault_openrouter_api_key: ""
vault_anthropic_api_key: ""
vault_google_api_key: ""
vault_groq_api_key: ""
vault_cerebras_api_key: ""
vault_deepseek_api_key: ""
vault_together_api_key: ""
vault_fireworks_api_key: ""
vault_perplexity_api_key: ""
vault_mistral_api_key: ""
vault_cohere_api_key: ""
vault_huggingface_api_key: ""
vault_replicate_api_key: ""
vault_anyscale_api_key: ""
vault_octoai_api_key: ""
vault_lepton_api_key: ""
vault_novita_api_key: ""
vault_featherless_api_key: ""
vault_cloudflare_api_key: ""
vault_sambanova_api_key: ""
vault_lambda_api_key: ""
