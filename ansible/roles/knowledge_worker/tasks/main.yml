---
- name: Create knowledge worker log directory
  ansible.builtin.file:
    path: "{{ knowledge_worker_log_dir }}"
    state: directory
    owner: "{{ knowledge_worker_user }}"
    mode: "0755"
  become: true

- name: Deploy knowledge-worker systemd service
  ansible.builtin.template:
    src: knowledge-worker.service.j2
    dest: /etc/systemd/system/knowledge-worker.service
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart knowledge worker

- name: Enable and start knowledge worker
  ansible.builtin.systemd:
    name: knowledge-worker
    state: started
    enabled: true
    daemon_reload: true
  become: true

- name: Verify knowledge worker is processing via REST API
  ansible.builtin.uri:
    url: "{{ knowledge_worker_api_url }}/queue/status"
    method: GET
    status_code: 200
    timeout: 10
  register: queue_check
  retries: 3
  delay: 5
  until: queue_check.status == 200
