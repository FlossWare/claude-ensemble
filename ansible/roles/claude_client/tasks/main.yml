---
- name: Ensure Claude Code directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ claude_config_dir }}"
    - "{{ claude_hooks_dir }}"
    - "{{ claude_lib_dir }}"
    - "{{ claude_spool_dir }}"
    - "{{ claude_mcp_dir }}"

- name: Sync hook scripts
  ansible.builtin.copy:
    src: "{{ claude_hooks_dir }}/{{ item }}"
    dest: "{{ claude_hooks_dir }}/{{ item }}"
    mode: "0755"
    remote_src: true
  loop: "{{ hook_scripts }}"
  failed_when: false

- name: Sync lib scripts
  ansible.builtin.copy:
    src: "{{ claude_lib_dir }}/{{ item }}"
    dest: "{{ claude_lib_dir }}/{{ item }}"
    mode: "0755"
    remote_src: true
  loop: "{{ lib_scripts }}"
  failed_when: false

- name: Verify settings.json exists
  ansible.builtin.stat:
    path: "{{ claude_config_dir }}/settings.json"
  register: settings_check

- name: Warn if settings.json is missing
  ansible.builtin.debug:
    msg: "WARNING: {{ claude_config_dir }}/settings.json not found. Hooks will not fire without it."
  when: not settings_check.stat.exists

- name: Verify CLAUDE.md exists
  ansible.builtin.stat:
    path: "{{ claude_config_dir }}/CLAUDE.md"
  register: claudemd_check

- name: Warn if CLAUDE.md is missing
  ansible.builtin.debug:
    msg: "WARNING: {{ claude_config_dir }}/CLAUDE.md not found."
  when: not claudemd_check.stat.exists

- name: Deploy spool-drain cron job
  ansible.builtin.cron:
    name: "claude-spool-drain"
    minute: "{{ spool_drain_interval }}"
    job: "{{ claude_lib_dir }}/spool-drain.sh 2>/dev/null"
    state: present
  when: spool_drain_cron

- name: Verify orchestrator connectivity
  ansible.builtin.uri:
    url: "{{ api_base }}/health"
    method: GET
    status_code: 200
    timeout: 5
  register: api_check
  failed_when: false

- name: Display connectivity status
  ansible.builtin.debug:
    msg: "Orchestrator ({{ api_base }}): {{ 'reachable' if api_check.status == 200 else 'UNREACHABLE — spool fallback will activate' }}"
