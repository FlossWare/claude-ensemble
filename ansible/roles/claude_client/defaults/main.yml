---
claude_config_dir: "{{ ansible_env.HOME }}/.claude"
claude_hooks_dir: "{{ claude_config_dir }}/hooks"
claude_lib_dir: "{{ claude_config_dir }}/lib"
claude_spool_dir: "{{ claude_config_dir }}/spool"
claude_mcp_dir: "{{ claude_config_dir }}/mcp-servers"

spool_drain_cron: true
spool_drain_interval: "*/5"

hook_scripts:
  - session-start
  - ingest-session-start
  - ingest-session-end
  - ingest-prompt
  - ingest-post-tool
  - rag-search

lib_scripts:
  - ingest-core.sh
  - spool-drain.sh
