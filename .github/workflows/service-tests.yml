name: Service Health & Unit Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        python -m pip install pytest pytest-cov

    - name: Run recursive execution tests
      run: python -m pytest execution/test_execution.py -v

    - name: Run arbitration tests
      run: python -m pytest arbitration/test_orchestrator.py -v

    - name: Run Memory Service tests
      run: |
        cd memory-service
        python -m pytest test_memory_service.py -v
        cd ..

    - name: Run Thompson Service tests
      run: |
        cd thompson-service
        python -m pytest test_thompson_service.py -v
        cd ..

    - name: Run Learning Service tests
      run: |
        cd learning-service
        python test_learning_service.py
        cd ..

    - name: Run Alert Service tests
      run: |
        cd alert_service
        python -m pytest test_alert_service.py -v
        cd ..

    - name: Run Graph Service end-to-end tests
      run: python graph-service/test_graph_service.py

    - name: Run service lifecycle ownership contract
      run: python test/test_service_lifecycle.py

    - name: Test imports and module structure
      run: |
        python -c "import sys; sys.path.insert(0, '.'); from shared.thompson_client import ThompsonClient; print('✓ Thompson client imports')"
        python -c "import sys; sys.path.insert(0, '.'); from memory.memory_client import MemoryClient; print('✓ Memory client imports')" || true
        python -c "import sys; sys.path.insert(0, './learning'); from learning_client import LearningClient; print('✓ Learning client imports')"
        python -c "import sys; sys.path.insert(0, './alert_service'); from alert_service import AlertStore; print('✓ Alert service imports')"

  service-startup:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest

    - name: Verify systemd service files
      run: |
        echo "Checking systemd service templates..."
        services=(
          "memory-service/claude-memory.service.template"
          "thompson-service/claude-thompson.service.template"
          "learning-service/claude-learning.service.template"
          "alert_service/claude-alert.service.template"
          "session-messaging/claude-messenger.service.template"
        )
        for template in "${services[@]}"; do
          if [ -f "$template" ]; then
            echo "✓ Found $template"
          else
            echo "✗ Missing $template"
            exit 1
          fi
        done

    - name: Verify install scripts are executable
      run: |
        for script in memory-service/install.sh thompson-service/install.sh learning-service/install.sh alert_service/install.sh session-messaging/install.sh; do
          if [ ! -x "$script" ]; then
            echo "✗ $script is not executable"
            exit 1
          fi
          echo "✓ $script is executable"
        done

    - name: Test Linux installer rendering
      run: python test/test_service_installers.py

    - name: Test install script template substitution
      run: |
        REPO_PATH=/tmp/test-repo
        for script in memory-service/install.sh thompson-service/install.sh learning-service/install.sh alert_service/install.sh session-messaging/install.sh; do
          if [ -f "$script" ]; then
            # Verify script contains the placeholder substitution
            if grep -q "%REPO_PATH%" "$script" || grep -q "sed.*REPO_PATH" "$script"; then
              echo "✓ $script contains path substitution"
            fi
          fi
        done

  lint-check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Check Python syntax
      run: |
        python -m py_compile execution/context.py execution/nodes.py execution/engine.py execution/test_execution.py workflows/solve.py workflows/review.py providers/model_provider.py providers/claude_code.py arbitration/orchestrator.py
        python -m py_compile shared/thompson_client.py
        python -m py_compile memory-service/memory_service.py
        python -m py_compile thompson-service/thompson_service.py
        python -m py_compile learning-service/learning_service.py
        python -m py_compile alert_service/alert_service.py
        python -m py_compile session-messaging/messenger_service.py
        python -m py_compile graph-service/graph_service.py
        echo "✓ All Python files compile successfully"

  docs-check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Verify documentation exists
      run: |
        REQUIRED_DOCS=(
          "SERVICES_GUIDE.md"
          "README.md"
          "memory-service/README.md"
          "thompson-service/README.md"
          "learning-service/README.md"
          "alert_service/README.md"
          "session-messaging/README.md"
        )

        for doc in "${REQUIRED_DOCS[@]}"; do
          if [ -f "$doc" ]; then
            echo "✓ Found $doc"
          else
            echo "✗ Missing $doc"
            exit 1
          fi
        done
