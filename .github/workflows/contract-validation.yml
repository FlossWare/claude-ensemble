name: Contract validation

on:
  pull_request:
    paths:
      - "docs/**"
      - "scripts/**"
      - "tests/**"
      - "runtime/**"
      - ".github/workflows/contract-validation.yml"
  push:
    branches:
      - main
      - "review/**"
    paths:
      - "docs/**"
      - "scripts/**"
      - "tests/**"
      - "runtime/**"
      - ".github/workflows/contract-validation.yml"

permissions:
  contents: read

jobs:
  validate-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Validate contract schemas, references, endpoint bindings, and JSON examples
        run: python scripts/validate_contracts.py
      - name: Validate service call graph
        run: python scripts/check_service_call_graph.py
      - name: Run contract regression tests
        run: python -m unittest discover -s tests -v
